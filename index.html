<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vic's Route</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif;overscroll-behavior:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:10px;left:12px;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;font-size:20px;line-height:1.3}
#hud small{font-size:13px;opacity:.8}
#over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;z-index:10}
#over h1{margin:0 0 8px}#over button{font-size:22px;padding:12px 30px;border:0;border-radius:10px;background:#ff4f8b;color:#fff;margin-top:14px}
#touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
.zone{position:absolute;bottom:0;height:50%;width:35%;border:2px dashed rgba(255,255,255,.12);box-sizing:border-box;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px;color:rgba(255,255,255,.4);font-size:34px}
#zl{left:0}#zr{right:0}
#jb{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:90px;height:90px;border-radius:50%;background:rgba(255,79,139,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="hud"><div id="score">0 m</div><small id="best">Best: 0 m</small><br><small id="mode">keyboard</small></div>
<div id="touch"><div class="zone" id="zl">◀</div><div class="zone" id="zr">▶</div><div id="jb">JUMP</div></div>
<div id="over"><h1>Game Over</h1><div id="final"></div><button id="restart">Restart</button><small style="margin-top:8px;opacity:.7">Space / tap to restart</small></div>
<script type="module">
import * as THREE from 'three';
const R=8, BASE=12, RAMP=0.5, RAMP_T=10, CAP=40, SPIN=8*Math.PI/180, JUMP_H=3.5, G=18,
  V0=Math.sqrt(2*G*JUMP_H), COYOTE=0.12, BUFFER=0.1, CAM_D=14, CAM_H=4;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0f1a);scene.fog=new THREE.Fog(0x0b0f1a,30,110);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,300);
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x202030,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(10,30,10);scene.add(sun);
// tube: vertical cylinder along Y, Vic runs downward (-Y). Texture scrolls to show motion.
const cv=document.createElement('canvas');cv.width=256;cv.height=256;const cx=cv.getContext('2d');
cx.fillStyle='#2a3350';cx.fillRect(0,0,256,256);cx.fillStyle='#3d4a75';cx.fillRect(0,0,256,24);
cx.fillStyle='#4f5f95';for(let i=0;i<8;i++)cx.fillRect(i*32,0,3,256);
const tex=new THREE.CanvasTexture(cv);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(8,30);
const tube=new THREE.Mesh(new THREE.CylinderGeometry(R,R,300,64,1,true),new THREE.MeshStandardMaterial({map:tex,roughness:.8}));
scene.add(tube);
// Vic placeholder capsule (no reference model found) — FLAGGED
const vic=new THREE.Group();

// Stylized Vic built from primitives, matching vic-reference.jpg. Local: +Y up(radial), +Z forward.
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.5,...o});
const mSkin=M(0xf3d2c1),mHair=M(0xe8eaee,{roughness:.35}),mRed=M(0xd8121b,{roughness:.2,metalness:.1}),
 mBlack=M(0x151515),mWhite=M(0xf2f0ea,{roughness:.8}),mPink=M(0xff5fae,{roughness:.25}),mSilver=M(0xc9ccd2,{metalness:.9,roughness:.25}),
 mMint=M(0x8fdcb8,{roughness:.35}),mMag=M(0xff2fb3,{emissive:0xff2fb3,emissiveIntensity:1.6}),mDark=M(0x333338,{metalness:.6});
const add=(par,geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);par.add(m);return m;};
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d),cyl=(r1,r2,h,n=12)=>new THREE.CylinderGeometry(r1,r2,h,n);
// legs (pivot at hip)
function leg(x){const g=new THREE.Group();g.position.set(x,0.95,0);vic.add(g);
 add(g,cyl(.075,.06,.45),mSkin,0,-.22,0);add(g,cyl(.068,.068,.36),mWhite,0,-.6,0); // thigh, sock
 add(g,box(.17,.2,.3),mPink,0,-.85,.05);add(g,box(.19,.06,.33),mPink,0,-.95,.05);return g;}
const legL=leg(-.11),legR=leg(.11);
add(vic,box(.38,.2,.26),mWhite,0,1.0,0); // shorts
add(vic,box(.42,.5,.28),mRed,0,1.33,0); // jacket torso
add(vic,box(.44,.07,.3),mBlack,0,1.13,0); // belt
add(vic,box(.06,.05,.02),mSilver,0,1.13,.155); // buckle
add(vic,cyl(.12,.15,.12),mRed,0,1.62,0); // high collar
add(vic,box(.015,.48,.01),mBlack,0,1.33,.145); // zip
// head
add(vic,cyl(.05,.05,.08),mSkin,0,1.7,0);
add(vic,new THREE.SphereGeometry(.14,16,12),mSkin,0,1.82,.01);
add(vic,new THREE.SphereGeometry(.155,16,12,0,Math.PI*2,0,Math.PI*.55),mHair,0,1.84,-.01);
add(vic,box(.32,.62,.1),mHair,0,1.55,-.11); // long straight hair down back
add(vic,box(.05,.38,.08),mHair,-.13,1.66,.04);add(vic,box(.05,.38,.08),mHair,.13,1.66,.04); // front strands
const band=add(vic,new THREE.TorusGeometry(.165,.018,6,20,Math.PI),mSilver,0,1.84,0);band.rotation.y=Math.PI/2;
for(const x of[-.17,.17]){const e=add(vic,cyl(.065,.065,.05),mSilver,x,1.8,0);e.rotation.z=Math.PI/2;}
add(vic,cyl(.008,.008,.35,6),mSilver,.17,2.0,-.02);add(vic,new THREE.SphereGeometry(.015),mSilver,.17,2.18,-.02); // antenna
// jetpack
add(vic,box(.3,.4,.08),mDark,0,1.32,-.18);
add(vic,cyl(.1,.1,.42),mMint,.1,1.32,-.28);add(vic,new THREE.SphereGeometry(.1,12,8,0,Math.PI*2,0,Math.PI/2),mMint,.1,1.53,-.28);
add(vic,cyl(.035,.035,.08),mSilver,.1,1.6,-.28);
add(vic,cyl(.06,.09,.14),mSilver,.1,1.04,-.28);
add(vic,new THREE.CircleGeometry(.07,12),mMag,.1,.969,-.28).rotation.x=Math.PI/2;
const glow=new THREE.PointLight(0xff2fb3,1.5,2.5);glow.position.set(.1,.9,-.28);vic.add(glow);
for(const x of[-.15,.15])add(vic,box(.05,.45,.04),mMint,x,1.36,.13).rotation.x=.1; // straps
// arms (pivot shoulder) holding SMGs
function arm(x){const g=new THREE.Group();g.position.set(x,1.54,0);vic.add(g);
 add(g,cyl(.06,.055,.5),mRed,0,-.25,0);add(g,new THREE.SphereGeometry(.05),mSkin,0,-.53,.02);
 const gun=new THREE.Group();gun.position.set(0,-.55,.08);g.add(gun);
 add(gun,box(.06,.1,.3),mSilver,0,.03,.08);add(gun,box(.04,.14,.05),mDark,0,-.06,0);add(gun,box(.035,.16,.04),mSilver,0,-.08,.12);
 const bar=add(gun,cyl(.03,.03,.1),mSilver,0,.04,.27);bar.rotation.x=Math.PI/2;
 const mz=add(gun,cyl(.034,.034,.04),mMag,0,.04,.33);mz.rotation.x=Math.PI/2;return g;}
const armL=arm(-.27),armR=arm(.27);armL.rotation.z=-.12;armR.rotation.z=.12;
vic.scale.setScalar(1.3); // visual only; collision uses VIC_HALF
const CLOSEUP=new URLSearchParams(location.search).has('closeup');
vic.traverse(o=>{if(o.isMesh)o.castShadow=false;});
const vicPivot=new THREE.Group();vicPivot.add(vic);scene.add(vicPivot);
// vic local: +Y = radial outward, +Z = facing direction (down the tube, -world Y)
const VIC_HALF=new THREE.Vector3(0.5,1.0,0.5); // half extents in local (tangent, radial, axial)
const obsGeo=new THREE.BoxGeometry(2.2,0.9,0.6), obsMat=new THREE.MeshStandardMaterial({color:0xffc83d,emissive:0x332200});
const OBS_HALF={t:1.1,r:0.45,a:0.3};
let st;const obstacles=[];
const best=()=>+(localStorage.getItem('vicRouteBest')||0);
function reset(){for(const o of obstacles)scene.remove(o.mesh);obstacles.length=0;
 st={theta:0,y:0,vy:0,grounded:true,lastGround:0,bufferT:-1,speed:BASE,t:0,dist:0,spawnIn:1.5,over:false,frames:0,spins:0,jumps:0};
 document.getElementById('over').style.display='none';}
reset();
const keys={left:false,right:false};const touchHold={left:false,right:false};const tapPend={left:0,right:0};
function requestJump(){if(st.over){reset();return;}st.bufferT=st.t;}
addEventListener('keydown',e=>{setMode('keyboard');
 if(e.code==='ArrowLeft'){keys.left=true;e.preventDefault();}
 if(e.code==='ArrowRight'){keys.right=true;e.preventDefault();}
 if(e.code==='Space'){e.preventDefault();if(!e.repeat)requestJump();}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;});
let mode='keyboard';
function setMode(m){if(m===mode)return;mode=m;document.getElementById('mode').textContent=m;
 document.getElementById('touch').style.display=m==='touch'?'block':'none';}
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window&&navigator.maxTouchPoints>0)setMode('touch');
const active=new Map();
function zoneOf(x,y){if(y<innerHeight/2)return 'jump';const w=innerWidth;
 const jb=document.getElementById('jb').getBoundingClientRect();
 if(x>=jb.left&&x<=jb.right&&y>=jb.top&&y<=jb.bottom)return 'jump';
 if(x<w*0.35)return 'left';if(x>w*0.65)return 'right';return 'jump';}
function syncHold(){touchHold.left=[...active.values()].includes('left');touchHold.right=[...active.values()].includes('right');}
const cvs=renderer.domElement;
function onTS(e){if(e.target.id==='restart')return;e.preventDefault();setMode('touch');
 for(const t of e.changedTouches){const z=zoneOf(t.clientX,t.clientY);active.set(t.identifier,z);if(z==='jump'||st.over)requestJump();else tapPend[z]=1;}syncHold();}
function onTE(e){e.preventDefault();for(const t of e.changedTouches)active.delete(t.identifier);syncHold();}
document.addEventListener('touchstart',onTS,{passive:false});
document.addEventListener('touchend',onTE,{passive:false});document.addEventListener('touchcancel',onTE,{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.getElementById('restart').addEventListener('click',()=>reset());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function spawn(){const m=new THREE.Mesh(obsGeo,obsMat);const o={mesh:m,theta:Math.random()*Math.PI*2,ay:-90};
 scene.add(m);obstacles.push(o);placeObs(o);}
function placeObs(o){const r=R+OBS_HALF.r;o.mesh.position.set(Math.sin(o.theta)*r,o.ay,Math.cos(o.theta)*r);o.mesh.rotation.set(0,o.theta,0);}
function angDiff(a,b){let d=a-b;d=Math.atan2(Math.sin(d),Math.cos(d));return d;}
function collide(o){if(!st.grounded)return false; // spec: collision only while not airborne
 const arc=Math.abs(angDiff(o.theta,st.theta))*R; const ax=Math.abs(o.ay-0);
 return arc<VIC_HALF.x+OBS_HALF.t && ax<VIC_HALF.z+OBS_HALF.a && st.y<OBS_HALF.r*2;}
function gameOver(){st.over=true;const m=Math.floor(st.dist);if(m>best())localStorage.setItem('vicRouteBest',m);
 document.getElementById('final').textContent=`${m} m — Best ${best()} m`;document.getElementById('over').style.display='flex';}
const clock=new THREE.Clock();const camPos=new THREE.Vector3(0,CAM_D,R+CAM_H);const look=new THREE.Vector3();
function step(dt){st.frames++;
 if(!st.over){st.t+=dt;
  const L=keys.left||touchHold.left||tapPend.left,Rt=keys.right||touchHold.right||tapPend.right;tapPend.left=tapPend.right=0;
  if(L){st.theta-=SPIN;st.spins++;} if(Rt){st.theta+=SPIN;st.spins++;}
  st.speed=Math.min(CAP,BASE+RAMP*Math.floor(st.t/RAMP_T));
  const move=st.speed*dt;st.dist+=move;tex.offset.y-=move/300*30;
  if(st.grounded)st.lastGround=st.t;
  const buffered=st.bufferT>=0&&st.t-st.bufferT<=BUFFER;
  if(buffered&&(st.grounded||st.t-st.lastGround<=COYOTE)&&st.vy<=0){st.vy=V0;st.grounded=false;st.bufferT=-1;st.jumps++;}
  if(!st.grounded){st.vy-=G*dt;st.y+=st.vy*dt;if(st.y<=0){st.y=0;st.vy=0;st.grounded=true;}}
  st.spawnIn-=dt;if(st.spawnIn<=0){spawn();st.spawnIn=1.8+Math.random()*1.4;}
  for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.ay+=move;placeObs(o);
   if(o.ay>20){scene.remove(o.mesh);obstacles.splice(i,1);continue;}
   if(collide(o)){gameOver();break;}}
  const ph=st.grounded?Math.sin(st.t*(8+st.speed*0.25)):0;legL.rotation.x=ph*0.7;legR.rotation.x=-ph*0.7;armL.rotation.x=-1.2-ph*0.35;armR.rotation.x=-1.2+ph*0.35;if(!st.grounded){legL.rotation.x=-0.6;legR.rotation.x=0.3;}}
 // place vic: pivot rotates around Y by theta; vic sits at radius R + y, facing -world Y
 vicPivot.rotation.y=st.theta;vic.position.set(0,0,R+st.y);vic.rotation.set(Math.PI/2+vic.rotation.x*0,0,0);
 vic.rotation.x=Math.PI/2; // local +Y -> outward(+Z pivot), local +Z -> down(-Y world)
 const s=Math.sin(st.theta),c=Math.cos(st.theta);
 const target=new THREE.Vector3(s*(R+CAM_H+st.y*0.3),CAM_D,c*(R+CAM_H+st.y*0.3));
 const k=1-Math.exp(-8*dt);camPos.lerp(target,k);camera.position.copy(camPos);
 look.set(s*R,-6,c*R);camera.up.set(s,0,c);camera.lookAt(look);
 if(CLOSEUP){const v=vic.getWorldPosition(new THREE.Vector3());const n=new THREE.Vector3(s,0,c);camera.position.copy(v).addScaledVector(n,1.6).add(new THREE.Vector3(0,-4.5,0));camera.up.copy(n);camera.lookAt(v.clone().addScaledVector(n,1.5));}
 document.getElementById('score').textContent=Math.floor(st.dist)+' m';
 document.getElementById('best').textContent='Best: '+Math.max(best(),Math.floor(st.dist))+' m';
}
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),0.05);step(dt);renderer.render(scene,camera);});
window.__game={get state(){return {...st,obstacles:obstacles.map(o=>({theta:o.theta,ay:o.ay})),mode,vicPos:vic.getWorldPosition(new THREE.Vector3()).toArray()}},
 spawnAt(theta,ay){const m=new THREE.Mesh(obsGeo,obsMat);const o={mesh:m,theta,ay};scene.add(m);obstacles.push(o);placeObs(o);},
 reset,jump:requestJump,consts:{R,BASE,CAP,V0,G,JUMP_H,COYOTE,BUFFER},placeholder:false};
</script></body></html>
